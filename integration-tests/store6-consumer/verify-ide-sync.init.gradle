import groovy.json.JsonOutput
import org.gradle.api.GradleException
import org.gradle.api.Project
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

// Run from the Trails root with --no-configuration-cache:
// ./gradlew -I integration-tests/store6-consumer/verify-ide-sync.init.gradle verifyDependencySync
// KGP 2.3.20's resolveIdeDependencies task reports unresolved entries without failing.
// Use its IDE resolver, collect every failure, then fail the verification explicitly.
gradle.projectsEvaluated {
    def root = gradle.rootProject
    root.tasks.register('verifyDependencySync') { task ->
        group = 'verification'
        description = 'Resolve every KMP IDE source set and Android compile dependency graph.'
        notCompatibleWithConfigurationCache('Diagnostic task inspects configured KMP projects.')
        def checks = []
        root.allprojects.sort { it.path }.each { p ->
            def plugin = p.plugins.findPlugin('org.jetbrains.kotlin.multiplatform')
            if (plugin != null) {
                def api = plugin.class.classLoader.loadClass(
                    'org.jetbrains.kotlin.gradle.plugin.ide.IdeMultiplatformImport')
                def importer = api.getMethod('instance', Project).invoke(null, p)
                // Resolver prerequisites use task.project, so each must belong to its KMP project.
                def prerequisites = p.tasks.register('prepareIdeResolution') { prerequisite ->
                    importer.addDependencyOnResolvers(prerequisite)
                }
                task.dependsOn(prerequisites)
                checks << [project: p, importer: importer]
            }
        }
        doLast {
            if (checks.empty) throw new GradleException('No Kotlin Multiplatform projects found.')
            def sourceSets = []
            def androidConfigurations = []
            def failures = []
            checks.each { check ->
                def p = check.project
                def kotlin = p.extensions.getByName('kotlin')
                kotlin.sourceSets.sort { it.name }.each { sourceSet ->
                    def row = [project: p.path, sourceSet: sourceSet.name]
                    try {
                        def dependencies = check.importer.resolveDependencies(sourceSet.name)
                        row.dependencyCount = dependencies.size()
                        dependencies.each { dependency ->
                            if (dependency.class.simpleName == 'IdeaKotlinUnresolvedBinaryDependency') {
                                failures << row + [kind: 'ide', coordinate: dependency.coordinates?.toString(),
                                    cause: dependency.cause]
                            }
                        }
                    } catch (Exception failure) {
                        failures << row + [kind: 'ide-exception', cause: failure.toString()]
                    }
                    sourceSets << row
                }

                // KGP deliberately delegates Android IDE dependencies to AGP. Resolve those
                // compile graphs separately, fetching external artifacts without compiling projects.
                def names = kotlin.targets.findAll { it.platformType.toString() == 'androidJvm' }
                    .collectMany { target -> target.compilations.collect { it.compileDependencyConfigurationName } }
                    .unique().sort()
                names.each { name ->
                    def row = [project: p.path, configuration: name]
                    try {
                        def configuration = p.configurations.getByName(name)
                        configuration.incoming.resolutionResult.allDependencies.each { dependency ->
                            if (dependency instanceof UnresolvedDependencyResult) {
                                failures << row + [kind: 'android-graph', coordinate: dependency.attempted.toString(),
                                    cause: dependency.failure.toString()]
                            }
                        }
                        def artifacts = configuration.incoming.artifactView { view ->
                            view.componentFilter { id -> id instanceof ModuleComponentIdentifier }
                            view.lenient(true) // Record all failures below; verification still fails.
                        }.artifacts
                        row.externalArtifactCount = artifacts.artifacts.size()
                        artifacts.failures.each { failure ->
                            failures << row + [kind: 'android-artifact', cause: failure.toString()]
                        }
                    } catch (Exception failure) {
                        failures << row + [kind: 'android-exception', cause: failure.toString()]
                    }
                    androidConfigurations << row
                }
            }
            def report = [projectCount: checks.size(), sourceSetCount: sourceSets.size(),
                androidConfigurationCount: androidConfigurations.size(), failureCount: failures.size(),
                sourceSets: sourceSets, androidConfigurations: androidConfigurations, failures: failures]
            def output = root.layout.buildDirectory.file('reports/dependency-sync.json').get().asFile
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson(report)) + '\n'
            logger.lifecycle("Checked ${checks.size()} KMP projects, ${sourceSets.size()} IDE source sets, " +
                "${androidConfigurations.size()} Android compile configurations; ${failures.size()} failures. Report: ${output}")
            failures.each { logger.error(JsonOutput.toJson(it)) }
            if (!failures.empty) throw new GradleException("Dependency sync verification failed: ${failures.size()} failures.")
        }
    }
}
